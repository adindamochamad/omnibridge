[package]
name = "omnibridge"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "omnibridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-serialplugin = "2.22.0"
serialport = "4.9.0"
tauri-plugin-store = "2.4.2"
# Native HTTP client for webhook forwarding — runs in Rust so requests are not
# subject to the WebView's CORS policy (browser fetch() hits CORS preflight).
# rustls-tls keeps the build self-contained (no system OpenSSL) across laptops.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

